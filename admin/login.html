<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ورود به پنل مدیریت فروشگاه هستی">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود به پنل مدیریت | هستی</title>
  <link rel="stylesheet" href="assets/admin-shared.css">
</head>

<body class="login-page">

  <aside class="login-aside"></aside>

  <main class="login-main">
    <div class="login-card">
      <div class="login-card__brand">
        <img src="assets/logo-transparent.png" alt="برند هستی" class="login-card__logo" width="220" height="154">
        <span>دسترسی اختصاصی مدیریت</span>
      </div>
      <h2>ورود به پنل</h2>
      <p>برای دسترسی به پنل مدیریت، شماره موبایل و رمز عبور خود را وارد کنید.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="label" for="phone">شماره موبایل <span class="req" aria-hidden="true">*</span></label>
          <input class="input ltr" type="tel" id="phone" name="phone" inputmode="tel" autocomplete="username"
            placeholder="09151234567" required aria-required="true">
          <!-- <span class="hint">شماره موبایلی که با آن حساب مدیریت ثبت شده است.</span> -->
        </div>

        <div class="field">
          <label class="label" for="password">رمز عبور <span class="req" aria-hidden="true">*</span></label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password"
              placeholder="••••••••" required aria-required="true">
            <button class="pw-toggle" type="button" id="pwToggle" aria-label="نمایش رمز عبور"></button>
          </div>
        </div>

        <div class="field security-field">
          <label class="label" for="securityCode">کد امنیتی <span class="req" aria-hidden="true">*</span></label>
          <div class="security-wrap">
            <input class="input ltr" type="text" id="securityCode" name="securityCode" inputmode="numeric"
              autocomplete="one-time-code" maxlength="5" placeholder="کد ۵ رقمی" required aria-required="true"
              aria-describedby="securityHint">
            <button class="security-challenge" type="button" id="refreshSecurity"
              aria-label="ساخت کد امنیتی جدید">
              <span id="securityChallenge" aria-hidden="true"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 7v5h-5"></path>
                <path d="M4 17v-5h5"></path>
                <path d="M7.5 7.5A7 7 0 0 1 19 10l1 2"></path>
                <path d="M16.5 16.5A7 7 0 0 1 5 14l-1-2"></path>
              </svg>
            </button>
          </div>
          <span class="hint" id="securityHint">کد نمایش‌داده‌شده را وارد کنید.</span>
        </div>

        <div class="login-row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember" checked>
            <span class="check__box"></span>
            <span>مرا به خاطر بسپار</span>
          </label>
          <a href="#" id="forgotLink">رمز عبور را فراموش کردم</a>
        </div>

        <!-- پیام خطای ورود ناموفق (aria-live تا صفحه‌خوان اعلام کند) -->
        <div id="loginError" class="notice notice--danger mb-2" role="alert" aria-live="assertive" hidden></div>

        <button class="btn btn--primary btn--block" type="submit" id="loginBtn">
          <span>ورود به پنل مدیریت</span>
        </button>
      </form>
    </div>
  </main>

  <script src="assets/data/mock-data.js"></script>
  <script src="assets/admin-shared.js"></script>
  <script src="assets/data/dataService.js"></script>
   <script>
(function () {
  "use strict";

  /* =========================================================
     DEMO LOGIN
     ========================================================= */

  var DEMO_PHONE = "09152500553";
  var DEMO_PASSWORD = "hasti1403";


  /* =========================================================
     ELEMENTS
     ========================================================= */

  var form = document.getElementById("loginForm");
  var phone = document.getElementById("phone");
  var password = document.getElementById("password");
  var securityCode = document.getElementById("securityCode");
  var securityChallenge = document.getElementById("securityChallenge");
  var refreshSecurity = document.getElementById("refreshSecurity");
  var errorBox = document.getElementById("loginError");
  var loginBtn = document.getElementById("loginBtn");
  var rememberCheckbox = document.getElementById("remember");
  var pwToggle = document.getElementById("pwToggle");
  var forgotLink = document.getElementById("forgotLink");

  var currentSecurityCode = "";


  /* =========================================================
     CHECK REQUIRED ELEMENTS
     ========================================================= */

  if (
    !form ||
    !phone ||
    !password ||
    !securityCode ||
    !securityChallenge ||
    !refreshSecurity ||
    !errorBox ||
    !loginBtn
  ) {
    console.error(
      "[Hasti Admin] Login elements not found."
    );

    return;
  }


  /* =========================================================
     SECURITY CODE
     ========================================================= */

  function createSecurityCode() {

    currentSecurityCode = String(
      Math.floor(10000 + Math.random() * 90000)
    );

    securityChallenge.textContent =
      typeof Admin !== "undefined" && Admin.fa
        ? Admin.fa(currentSecurityCode)
        : currentSecurityCode;

    securityCode.value = "";

    if (
      typeof Admin !== "undefined" &&
      typeof Admin.clearFieldError === "function"
    ) {
      Admin.clearFieldError(securityCode);
    }
  }


  refreshSecurity.addEventListener(
    "click",
    function () {

      createSecurityCode();

      securityCode.focus();

    }
  );


  createSecurityCode();


  /* =========================================================
     ERROR MESSAGE
     ========================================================= */

  function showError(message) {

    var icon = "";

    if (
      typeof Admin !== "undefined" &&
      typeof Admin.icon === "function"
    ) {
      icon = Admin.icon("alert");
    }

    errorBox.innerHTML =
      icon +
      "<span>" +
      "<b>ورود ناموفق بود</b> " +
      escapeHtml(message) +
      "</span>";

    errorBox.hidden = false;
  }


  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     CLEAR ERROR
     ========================================================= */

  function clearError() {

    errorBox.hidden = true;

    errorBox.innerHTML = "";
  }


  /* =========================================================
     PHONE NORMALIZATION
     ========================================================= */

  function normalizePhone(value) {

    value = String(value || "");

    /*
     * تبدیل اعداد فارسی و عربی به انگلیسی
     */

    var persian = "۰۱۲۳۴۵۶۷۸۹";
    var arabic = "٠١٢٣٤٥٦٧٨٩";

    for (var i = 0; i < 10; i++) {

      value = value.replace(
        new RegExp(persian[i], "g"),
        String(i)
      );

      value = value.replace(
        new RegExp(arabic[i], "g"),
        String(i)
      );
    }

    return value.replace(/\D/g, "");
  }


  /* =========================================================
     PASSWORD VISIBILITY
     ========================================================= */

  if (pwToggle) {

    if (
      typeof Admin !== "undefined" &&
      typeof Admin.icon === "function"
    ) {
      pwToggle.innerHTML =
        Admin.icon("eye");
    }

    pwToggle.addEventListener(
      "click",
      function () {

        var hidden =
          password.type === "password";

        password.type =
          hidden ? "text" : "password";

        if (
          typeof Admin !== "undefined" &&
          typeof Admin.icon === "function"
        ) {

          pwToggle.innerHTML =
            Admin.icon(
              hidden ? "x" : "eye"
            );
        }

        pwToggle.setAttribute(
          "aria-label",
          hidden
            ? "مخفی کردن رمز عبور"
            : "نمایش رمز عبور"
        );

      }
    );
  }


  /* =========================================================
     INPUT EVENTS
     ========================================================= */

  [phone, password, securityCode].forEach(
    function (field) {

      field.addEventListener(
        "input",
        function () {

          clearError();

          if (
            typeof Admin !== "undefined" &&
            typeof Admin.clearFieldError === "function"
          ) {
            Admin.clearFieldError(field);
          }

        }
      );

    }
  );


  /* =========================================================
     FORM VALIDATION
     ========================================================= */

  function validateLogin() {

    var enteredPhone =
      normalizePhone(phone.value);

    var enteredPassword =
      String(password.value || "");

    var enteredSecurity =
      normalizePhone(securityCode.value);

    /* PHONE */

    if (!enteredPhone) {

      showError(
        "وارد کردن شماره موبایل الزامی است."
      );

      phone.focus();

      return false;
    }


    if (!/^09\d{9}$/.test(enteredPhone)) {

      showError(
        "شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود."
      );

      phone.focus();

      return false;
    }


    /* PASSWORD */

    if (!enteredPassword) {

      showError(
        "وارد کردن رمز عبور الزامی است."
      );

      password.focus();

      return false;
    }


    if (enteredPassword.length < 6) {

      showError(
        "رمز عبور باید حداقل ۶ کاراکتر باشد."
      );

      password.focus();

      return false;
    }


    /* SECURITY CODE */

    if (!enteredSecurity) {

      showError(
        "وارد کردن کد امنیتی الزامی است."
      );

      securityCode.focus();

      return false;
    }


    if (
      enteredSecurity !==
      currentSecurityCode
    ) {

      showError(
        "کد امنیتی واردشده صحیح نیست."
      );

      createSecurityCode();

      securityCode.focus();

      return false;
    }


    return true;
  }


  /* =========================================================
     LOGIN
     ========================================================= */

  form.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      clearError();


      /* -----------------------------------------
         VALIDATION
         ----------------------------------------- */

      if (!validateLogin()) {
        return;
      }


      /* -----------------------------------------
         LOADING
         ----------------------------------------- */

      loginBtn.disabled = true;

      loginBtn.classList.add(
        "btn--loading"
      );


      /* -----------------------------------------
         DEMO LOGIN
         ----------------------------------------- */

      setTimeout(
        function () {

          var enteredPhone =
            normalizePhone(phone.value);

          var enteredPassword =
            String(password.value || "");


          /* =================================================
             SUCCESS
             ================================================= */

          if (
            enteredPhone === DEMO_PHONE &&
            enteredPassword === DEMO_PASSWORD
          ) {

            console.log(
              "[Hasti Admin] Login successful."
            );


            /* -----------------------------------------------
               REMEMBER ME
               ----------------------------------------------- */

            if (
              rememberCheckbox &&
              rememberCheckbox.checked
            ) {

              localStorage.setItem(
                "hasti_admin_remember",
                "1"
              );

            } else {

              localStorage.removeItem(
                "hasti_admin_remember"
              );
            }


            /* -----------------------------------------------
               SESSION
               ----------------------------------------------- */

            sessionStorage.setItem(
              "hasti_admin_session",
              "demo"
            );


            /*
             * ذخیره وضعیت احراز هویت
             * برای جلوگیری از ناسازگاری با کدهای
             * مختلف پروژه، چند کلید رایج را نگه می‌داریم.
             */

            localStorage.setItem(
              "hasti_admin_auth",
              "1"
            );

            localStorage.setItem(
              "hasti_admin_logged_in",
              "1"
            );


            /* -----------------------------------------------
               DEBUG
               ----------------------------------------------- */

            console.log(
              "[Hasti Admin] Session:",
              sessionStorage.getItem(
                "hasti_admin_session"
              )
            );

            console.log(
              "[Hasti Admin] Redirecting to index.html..."
            );


            /* -----------------------------------------------
               REDIRECT
               ----------------------------------------------- */

            window.location.replace(
              "index.html"
            );

          }

          /* =================================================
             FAILED
             ================================================= */

          else {

            loginBtn.disabled = false;

            loginBtn.classList.remove(
              "btn--loading"
            );


            showError(
              "شماره موبایل یا رمز عبور نادرست است."
            );


            password.value = "";

            createSecurityCode();

            password.focus();

          }

        },
        500
      );

    }
  );


  /* =========================================================
     FORGOT PASSWORD
     ========================================================= */

  if (forgotLink) {

    forgotLink.addEventListener(
      "click",
      function (event) {

        event.preventDefault();

        if (
          typeof Admin !== "undefined" &&
          typeof Admin.modal === "function"
        ) {

          Admin.modal({

            title:
              "بازیابی رمز عبور",

            icon:
              "key",

            body:
              "<p>" +
              "برای بازیابی رمز عبور با مدیر کل فروشگاه تماس بگیرید." +
              "</p>" +

              "<p>" +
              "شماره تماس: " +
              "<strong>۰۹۱۵۲۵۰۰۵۵۳</strong>" +
              "</p>",

            actions: [
              {
                label:
                  "متوجه شدم",

                variant:
                  "btn--primary",

                onClick:
                  function (modal) {
                    modal.close();
                  }
              }
            ]

          });

        } else {

          alert(
            "برای بازیابی رمز عبور با مدیر فروشگاه تماس بگیرید."
          );

        }

      }
    );

  }


  /* =========================================================
     REMEMBER ME
     ========================================================= */

  if (
    localStorage.getItem(
      "hasti_admin_remember"
    ) === "1"
  ) {

    phone.value =
      DEMO_PHONE;

    password.focus();

  } else {

    phone.focus();

  }


  /* =========================================================
     OPTIONAL STATS
     ========================================================= */

  (async function loadStats() {

    try {

      if (
        typeof dataService === "undefined" ||
        !dataService
      ) {
        return;
      }


      var products =
        await dataService.getProducts();

      var orders =
        await dataService.getOrders();

      var customers =
        await dataService.getCustomers();


      products =
        Array.isArray(products)
          ? products
          : [];

      orders =
        Array.isArray(orders)
          ? orders
          : [];

      customers =
        Array.isArray(customers)
          ? customers
          : [];


      var statProducts =
        document.getElementById(
          "statProducts"
        );

      var statOrders =
        document.getElementById(
          "statOrders"
        );

      var statCustomers =
        document.getElementById(
          "statCustomers"
        );


      if (statProducts) {

        var published =
          products.filter(
            function (product) {

              return (
                product &&
                product.status ===
                "published"
              );

            }
          ).length;

        statProducts.textContent =
          String(published);
      }


      if (statOrders) {

        statOrders.textContent =
          String(orders.length);
      }


      if (statCustomers) {

        statCustomers.textContent =
          String(customers.length);
      }

    } catch (error) {

      console.warn(
        "[Hasti Admin] Stats unavailable:",
        error
      );

    }

  })();


})();
</script>
